name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests -v
  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: clang -fsyntax-only -Wall -Wextra titlebar-fix.m
